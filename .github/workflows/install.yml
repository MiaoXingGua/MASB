name: install
permissions:
  contents: write
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [win, macos, linux, android]
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || (matrix.os == 'linux' && 'linux') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          latest: true
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      # ========== 新增：安装 maafw 到本地依赖目录 ==========
      - name: Install maafw to local directory
        shell: bash
        run: |
          # 创建本地依赖目录（与 agent 同路径）
          mkdir -p install/agent/libs
          # 安装 maafw 到本地目录（不同系统适配）
          if [[ "${{ matrix.os }}" == "win" ]]; then
            # Windows 下指定安装路径
            python -m pip install maafw --target=install/agent/libs --platform=win_amd64 --only-binary=:all:
          elif [[ "${{ matrix.os }}" == "macos" ]]; then
            # macOS 区分架构
            if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
              python -m pip install maafw --target=install/agent/libs --platform=macosx_x86_64 --only-binary=:all:
            else
              python -m pip install maafw --target=install/agent/libs --platform=macosx_arm64 --only-binary=:all:
            fi
          elif [[ "${{ matrix.os }}" == "linux" ]]; then
            # Linux 区分架构
            if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
              python -m pip install maafw --target=install/agent/libs --platform=manylinux_x86_64 --only-binary=:all:
            else
              python -m pip install maafw --target=install/agent/libs --platform=manylinux_aarch64 --only-binary=:all:
            fi
          elif [[ "${{ matrix.os }}" == "android" ]]; then
            # Android 适配（按需调整）
            python -m pip install maafw --target=install/agent/libs --platform=android_aarch64 --only-binary=:all:
          fi

      - name: Install
        shell: bash
        run: |
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }}

          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
            else
              echo "MFA directory not found, skipping copy."
            fi
            if [[ "${{ matrix.os }}" == "win" ]]; then
              mkdir -p install
              cp -v "tools/DependencySetup_依赖库安装.bat" install/
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

      # ========== 新增：添加依赖路径到 main.py（关键） ==========
      - name: Add libs path to main.py
        shell: bash
        run: |
          # 在 main.py 开头添加依赖路径（确保能找到 maafw）
          sed -i '1i import sys; sys.path.append("./libs")' install/agent/main.py
          # 验证：检查 main.py 是否修改成功
          cat install/agent/main.py | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: MASB-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - run: |
          cd assets
          for f in *; do
            (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
